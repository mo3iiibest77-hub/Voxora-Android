name: Android CI

# Build/test only when app source or build config changes.
# Pure docs commits (AGENTS.md, CloudMD.md, AgentMD.md, CLAUDE.md, README, etc.)
# do not start assembleDebug or unit tests. workflow_dispatch still always runs.
on:
  push:
    branches: [main, feat/reader-segmented-spooling]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Do NOT use default packages — they include legacy "tools"
      # removed in cmdline-tools 16+ (Failed to find package 'tools')
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      # Same debug.keystore across CI runs → APK can update over previous install
      # (avoids "different package / must uninstall" when only signature differs)
      - name: Cache stable debug keystore
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/debug.keystore
            ~/.android/debug.keystore.lock
          key: voxora-debug-keystore-v1

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Voxora CI, OU=Dev, O=Voxora, L=Tehran, ST=TR, C=IR"
          fi
          ls -la ~/.android/debug.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voxora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Independent from the APK job so a contract-test regression is reported
  # without preventing the debug artifact from being produced.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: |
          gradle :core:testDebugUnitTest :app:testDebugUnitTest --stacktrace --no-daemon
